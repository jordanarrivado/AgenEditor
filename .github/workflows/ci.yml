name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ffmpeg:
    name: Pinned FFmpeg (Linux cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: .tools/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/ffmpeg/**', 'scripts/build_ffmpeg.py', 'docs/FFMPEG_BUILD.md') }}
      - name: Build from pinned, hash-checked sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 scripts/build_ffmpeg.py
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build
          path: .tools/ffmpeg/

  engine:
    name: Engine (Python, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Sync
        run: uv sync --locked --extra transcribe --extra ai
      - name: Lint
        run: |
          uv run --locked --extra transcribe --extra ai ruff check packages tests/engine scripts
          uv run --locked --extra transcribe --extra ai ruff format --check packages tests/engine scripts
      - name: Test (generates fixture media)
        run: uv run --locked --extra transcribe --extra ai pytest
      - name: OpenTimelineIO reference compatibility
        run: uv run --locked --extra transcribe --extra ai --group interop python -c "import opentimelineio; import pytest; raise SystemExit(pytest.main(['tests/engine/test_otio.py']))"
      - name: Licence report (informational; the release workflow enforces it)
        run: uv run --locked --extra transcribe --extra ai python scripts/license_report.py --out license-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.md

  portability:
    # Informational (Phase 6): does the engine pass and does the desktop shell compile off Windows?
    # No macOS or Linux package is built; the pinned FFmpeg build and installer are Windows-only.
    name: Portability check (${{ matrix.os }}, informational)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install FFmpeg and desktop build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Engine tests
        run: |
          uv sync --locked
          uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Desktop shell compiles and its unit tests pass
        run: |
          npm ci
          npm run build
          cd apps/desktop/src-tauri
          cargo test --locked

  ui:
    name: Static UI (Node, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Playwright
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- demo-workflow

  native:
    name: Packaged Windows engine and desktop
    needs: [engine, ui, ffmpeg]
    runs-on: windows-latest
    env:
      AGENEDITOR_REQUIRE_PINNED_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install ffmpeg --no-progress -y  # fixture generation; the installer bundles the pinned build
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-build
          path: .tools/ffmpeg
      - name: Verify pinned FFmpeg on Windows
        run: uv run python scripts/build_ffmpeg.py --verify-only
      - run: npm ci
      - run: npm run desktop:build
      - name: Packaged engine integration
        run: |
          uv run ageneditor fixtures
          uv run --extra transcribe ageneditor cache-model tiny
          uv run python scripts/smoke_packaged.py --engine apps/desktop/src-tauri/target/release/ageneditor-engine.exe --media tests/fixtures/media/talking_head_16x9_30fps_60s.mp4 --out .tools/packaged-smoke --transcribe-preset tiny
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-verification
          retention-days: 7
          path: |
            .tools/packaged-smoke/result.json
            .tools/packaged-smoke/service.log
            apps/desktop/src-tauri/resources/third-party/inventory.json
