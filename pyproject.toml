[project]
name = "ageneditor"
version = "0.0.1"
description = "Local-first, editing-only AI video editor engine (contracts, media probing, timeline)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.9,<3",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.2.1,<2", "av>=11,<19"]

[project.scripts]
ageneditor = "ageneditor.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]
desktop = ["pyinstaller>=6.15,<7"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/ageneditor"]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests/engine"]
markers = ["media: needs ffmpeg/ffprobe and generated fixture media"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages", "tests"]
extend-exclude = ["node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PTH", "RUF"]
ignore = [
  "S603", # subprocess without shell — we always pass argument lists, never shell=True
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
